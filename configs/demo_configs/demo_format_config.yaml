# yaml-language-server: $schema=../../schemas/format.schema.json
data:
  class_path:
    WikitextDataset
  init_args:
    split: train
    head: 1000

formatter:
  class_path: MirrorLlamaFormatter
  init_args:
    max_length: 2048

# checkpoint:
#   training_run_id: <training_run_id>
#   checkpoint_name: <checkpoint_name>

slurm:
  job_type: compute
  time: "01:00:00"
  gpus_per_node: "p100:1"
  nodes: 4
  mem_per_cpu: "128G"
  output: "slurm_logs/%j.out"
  open_mode: "append"
  signal: "SIGHUP@90"
  requeue: true